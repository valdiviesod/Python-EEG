# NAD — Campo resonante remoto (Python :9040)
# Include inside the donecenter.net HTTPS server block.

location = /nad {
    return 301 /nad/;
}

location /nad/ {
    client_max_body_size 500M;
    proxy_pass http://127.0.0.1:9040/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /nad;
    proxy_connect_timeout 30s;
    proxy_read_timeout 120s;

    sub_filter_once off;
    sub_filter_types text/html text/css text/javascript application/javascript application/json;
    sub_filter 'href="/' 'href="/nad/';
    sub_filter 'src="/' 'src="/nad/';
    sub_filter "fetch('/api/" "fetch('/nad/api/";
    sub_filter 'fetch("/api/' 'fetch("/nad/api/';
    sub_filter '`/api/' '`/nad/api/';
}
